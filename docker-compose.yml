version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: mailflow-db

    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: mailflow_db

    ports:
      - "3307:3306"

  app:
    build: .
    container_name: mailflow-app

    ports:
      - "8080:8080"

    depends_on:
      - mysql

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mailflow_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root@123